<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cartell setmanal · Blanca Subur</title>
<link rel="icon" type="image/png" href="../iconos/app-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --color: #1747c9; --hondo: #0b2a7a; --claro: #3a74ff; --suave: #e8efff;
    --tinta: #131722; --gris: #5f6678; --fondo: #eef1f6;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --texto: "Barlow", "Segoe UI", sans-serif;
    --alt: 1350px; /* alçada del cartell: 1350 (post) o 1920 (història) */
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--fondo); font-family: var(--texto); color: var(--tinta); }
  button { font: inherit; cursor: pointer; }

  /* ---------- Barra de control (no surt a la imatge) ---------- */
  .control {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #dfe3ea;
  }
  .control .semana { font-weight: 700; min-width: 170px; text-align: center; }
  .btn { border: 1.5px solid #d6dbe5; background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; }
  .btn.prim { background: var(--color); border-color: var(--color); color: #fff; }
  .btn[aria-pressed="true"] { background: var(--suave); border-color: var(--color); color: var(--hondo); }
  .nota { text-align: center; color: var(--gris); font-size: 0.85rem; margin: 10px 16px 0; }

  /* ---------- Cartell: 1080 × 1350 (post d'Instagram) o 1080 × 1920 (història) ---------- */
  .escena { display: flex; justify-content: center; padding: 16px 0 40px; }
  .marco { width: calc(1080px * var(--k)); height: calc(var(--alt) * var(--k)); overflow: hidden; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.5); }
  .cartell {
    width: 1080px; height: var(--alt); transform: scale(var(--k)); transform-origin: top left;
    position: relative; overflow: hidden; box-sizing: border-box; padding: 40px 40px 28px;
    /* degradat vertical: html2canvas dibuixa malament els degradats en diagonal */
    background: linear-gradient(180deg, var(--hondo) 0%, #071433 55%, #040b20 100%);
    color: #fff; display: flex; flex-direction: column; gap: 16px;
  }
  /* Franges de pinzell diagonals (decoració) */
  .franja { position: absolute; left: -200px; width: 1500px; transform: rotate(-12deg); pointer-events: none; }
  .franja.a { top: 190px; height: 120px; background: var(--color); opacity: 0.55; }
  .franja.b { top: 300px; height: 26px; background: var(--claro); opacity: 0.45; }
  .franja.c { bottom: 120px; height: 90px; background: var(--color); opacity: 0.35; }
  .foto { position: absolute; left: 0; right: 0; top: 0; height: 420px; background-size: cover; background-position: center 20%; opacity: 0.55; }
  .foto::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,11,32,0) 30%, #071433 100%); }
  .cartell > *:not(.franja):not(.foto) { position: relative; }

  /* Capçalera: escut gran, títol i dates */
  .cab { text-align: center; }
  .cab .escut { width: 150px; height: 150px; border-radius: 50%; background: #fff; padding: 14px; box-sizing: border-box; object-fit: contain;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.25), 0 14px 30px -10px rgba(0,0,0,0.6); }
  .cab .eyebrow { margin-top: 10px; font-size: 22px; font-weight: 800; letter-spacing: 0.32em; text-transform: uppercase; opacity: 0.9; }
  .cab h1 { margin: 2px 0 0; font-family: var(--display); font-style: italic; font-weight: 900; font-size: 116px; line-height: 0.9;
    text-transform: uppercase; text-shadow: 0 5px 0 var(--color), 0 10px 24px rgba(0,0,0,0.5); }
  .cab .dates { display: inline-block; margin-top: 8px; padding: 4px 18px; border-radius: 8px; background: var(--color);
    font-family: var(--display); font-weight: 800; font-size: 30px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* Partits destacats (primers equips) */
  .destacats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .dest { background: #fff; color: var(--tinta); border-radius: 18px; overflow: hidden; text-align: center; }
  .dest .t { background: var(--color); color: #fff; font-family: var(--display); font-weight: 900; font-size: 28px; text-transform: uppercase; padding: 4px 10px; letter-spacing: 0.04em; }
  .dest .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 8px 14px 2px;
    font-family: var(--display); font-weight: 800; font-size: 27px; text-transform: uppercase; line-height: 1; }
  .dest .vs b { font-style: italic; font-size: 34px; color: var(--color); }
  .dest .info { font-weight: 700; font-size: 20px; color: var(--gris); padding: 0 10px 8px; }

  /* Dues columnes: dissabte i diumenge */
  .dies { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .dia { background: #fff; color: var(--tinta); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .dia-cab { background: linear-gradient(180deg, var(--color), var(--hondo)); color: #fff; padding: 10px 14px 8px; text-align: center; }
  .dia-cab b { display: block; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 36px; text-transform: uppercase; line-height: 1; }
  .dia-cab span { font-size: 18px; font-weight: 600; opacity: 0.9; }
  .dia-cos { flex: 1; min-height: 0; overflow: hidden; padding: 4px 10px 8px; font-size: var(--fs, 22px); }
  .grup { display: flex; align-items: center; gap: 0.35em; margin: 0.45em 0 0.15em; padding: 0.12em 0.45em; border-radius: 0.35em;
    background: var(--suave); color: var(--hondo); font-family: var(--display); font-weight: 900; font-size: 1em; text-transform: uppercase; letter-spacing: 0.04em; }
  .mini { width: 1.05em; height: 1.05em; flex: none; object-fit: contain; }
  .fila { display: grid; grid-template-columns: 2.6em 1.05em auto 1fr auto; align-items: center; gap: 0.3em; padding: 0.16em 0.05em;
    border-bottom: 1px solid #edf0f5; line-height: 1.15; white-space: nowrap; }
  .fila .h { font-weight: 800; color: var(--gris); }
  .fila .eq { font-weight: 800; }
  .fila .rv { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--gris); font-size: 0.86em; }
  .fila .rv i { font-style: normal; font-weight: 700; opacity: 0.7; }
  .lloc { font-family: var(--display); font-weight: 800; font-size: 0.78em; padding: 0.1em 0.45em; border-radius: 0.3em; text-transform: uppercase; }
  .lloc.casa { background: var(--color); color: #fff; }
  .lloc.fora { background: #e3e7ef; color: var(--tinta); }
  .res { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 1.05em; padding: 0.05em 0.4em; border-radius: 0.3em; color: #fff; }
  .res.G { background: #1f8a4c; } .res.E { background: #b7791f; } .res.P { background: #9aa1b2; }
  .buit { color: var(--gris); text-align: center; padding: 1.5em 0.5em; }

  /* Descansen, xifres i peu */
  .descansen { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; justify-content: center;
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.25); border-radius: 16px; padding: 8px 14px; }
  .descansen b { font-family: var(--display); font-weight: 900; font-size: 24px; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 6px; }
  .descansen span { background: rgba(255,255,255,0.16); border-radius: 999px; padding: 3px 12px; font-size: 18px; font-weight: 700; }
  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tot { display: flex; align-items: center; justify-content: center; gap: 12px; background: rgba(255,255,255,0.1); border-radius: 16px; padding: 8px 10px; }
  .tot svg { width: 36px; height: 36px; flex: none; }
  .tot b { display: block; font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1; }
  .tot span { display: block; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; }
  .peu { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; font-size: 24px; font-weight: 700; }
  .xarxa { display: flex; align-items: center; gap: 10px; }
  .xarxa.dreta { justify-content: flex-end; }
  .xarxa svg { width: 34px; height: 34px; flex: none; }
  .patro { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 6px 22px; border-radius: 14px; background: #fff; color: var(--tinta); }
  .patro img { max-height: 58px; max-width: 300px; object-fit: contain; }
  .patro .nom { font-family: var(--display); font-weight: 900; font-size: 34px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--hondo); }
  .patro.buit-p { background: transparent; border: 2px dashed rgba(255,255,255,0.5); color: #fff; font-size: 20px; }
  .marca { text-align: center; font-size: 15px; font-weight: 600; opacity: 0.55; margin-top: -6px; }

  /* Format post (1080 × 1350): més compacte */
  .post.cartell { padding: 30px 34px 22px; gap: 12px; }
  .post .cab .escut { width: 118px; height: 118px; padding: 11px; }
  .post .cab .eyebrow { font-size: 18px; margin-top: 6px; }
  .post .cab h1 { font-size: 92px; }
  .post .cab .dates { font-size: 25px; margin-top: 4px; }
  .post .dest .t { font-size: 23px; } .post .dest .vs { font-size: 23px; padding-top: 5px; } .post .dest .vs b { font-size: 28px; } .post .dest .info { font-size: 17px; padding-bottom: 5px; }
  .post .dia-cab b { font-size: 30px; } .post .dia-cab span { font-size: 15px; }
  .post .descansen { padding: 5px 12px; } .post .descansen b { font-size: 20px; } .post .descansen span { font-size: 15px; }
  .post .tot { padding: 5px 8px; } .post .tot b { font-size: 34px; } .post .tot svg { width: 28px; height: 28px; } .post .tot span { font-size: 12px; }
  .post .peu { font-size: 20px; } .post .xarxa svg { width: 28px; height: 28px; } .post .patro { min-height: 52px; } .post .patro img { max-height: 46px; }
  .post .franja.a { top: 150px; } .post .franja.b { top: 240px; } .post .foto { height: 330px; }
</style>
</head>
<body>
<div class="control">
  <button class="btn" id="ant" type="button" aria-label="Cap de setmana anterior">‹</button>
  <div class="semana" id="semana">…</div>
  <button class="btn" id="sig" type="button" aria-label="Cap de setmana següent">›</button>
  <button class="btn" id="m-partits" type="button" aria-pressed="true">Partits</button>
  <button class="btn" id="m-resultats" type="button" aria-pressed="false">Resultats</button>
  <button class="btn" id="f-post" type="button" aria-pressed="true">Post</button>
  <button class="btn" id="f-historia" type="button" aria-pressed="false">Història</button>
  <button class="btn prim" id="baixar" type="button">⬇ Descarregar imatge</button>
</div>
<p class="nota" id="nota">Carregant els partits…</p>

<div class="escena"><div class="marco"><div class="cartell post" id="cartell">
  <div class="foto" id="foto" hidden></div>
  <div class="franja a"></div><div class="franja b"></div><div class="franja c"></div>
  <header class="cab">
    <img class="escut" src="../escut.png" alt="" onerror="this.remove()">
    <div class="eyebrow" id="eyebrow">Partits del cap de setmana</div>
    <h1>Blanca Subur</h1>
    <div class="dates" id="dates"></div>
  </header>
  <section class="destacats" id="destacats" hidden></section>
  <section class="dies">
    <div class="dia"><div class="dia-cab"><b id="d1-tit"></b><span id="d1-sub"></span></div><div class="dia-cos" id="d1"></div></div>
    <div class="dia"><div class="dia-cab"><b id="d2-tit"></b><span id="d2-sub"></span></div><div class="dia-cos" id="d2"></div></div>
  </section>
  <section class="descansen" id="descansen" hidden></section>
  <section class="totals" id="totals"></section>
  <footer class="peu" id="peu"></footer>
  <div class="marca">amb ConvoCAT</div>
</div></div></div>

<script>
  const API = 'https://calendari-futbol-base-demo.netlify.app'; // servidor de ConvoCAT (Netlify)
  const CLUB = 'blanca-subur', NUESTRO = 'Blanca Subur';
  // Xarxes socials, patrocinador i foto de capçalera del club (clubs.mjs)
  const EXTRA = {"instagram":null,"tiktok":null,"patrocinador":null,"foto":null};
  const ORDRE = ['Prebenjamí', 'Benjamí', 'Aleví', 'Infantil', 'Cadet', 'Juvenil', 'Femení', 'Sènior'];
  const DIES = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  const MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
  const $ = id => document.getElementById(id);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const deMes = m => (/^[aeiou]/i.test(MESOS[m]) ? "d'" : 'de ') + MESOS[m];
  const html = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const MINI = '<img class="mini" src="../escut.png" alt="">';
  const ICONA = {
    partits: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4 2.9-1.5 4.7h-5L8 10.4z" fill="#fff"/></svg>',
    casa: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
    fora: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M3 11h18M7 17v2M17 17v2"/><circle cx="7.5" cy="14" r="1" fill="#fff"/><circle cx="16.5" cy="14" r="1" fill="#fff"/></svg>',
    descansen: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="2"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="#fff" stroke="none"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M14 3h3a4 4 0 0 0 4 4v3a7 7 0 0 1-4-1.3V15a6 6 0 1 1-6-6v3.2A2.8 2.8 0 1 0 14 15z"/></svg>',
  };

  let DADES = null, mode = 'partits';
  let format = 'post'; try { format = localStorage.getItem('cartell-format') || 'post'; } catch (e) {}
  const ALT = () => format === 'post' ? 1350 : 1920;
  function posaFormat() {
    document.documentElement.style.setProperty('--alt', ALT() + 'px');
    $('cartell').classList.toggle('post', format === 'post');
    $('f-post').setAttribute('aria-pressed', format === 'post');
    $('f-historia').setAttribute('aria-pressed', format !== 'post');
    try { localStorage.setItem('cartell-format', format); } catch (e) {}
    escala(); if (DADES) ajusta();
  }
  // Cap de setmana: de dilluns a divendres, el que ve; dissabte i diumenge, l'actual
  const avui = new Date(); avui.setHours(12, 0, 0, 0);
  let dissabte = new Date(avui); dissabte.setDate(avui.getDate() + ((6 - avui.getDay() + 7) % 7) - (avui.getDay() === 0 ? 7 : 0));
  if (avui.getDay() >= 1 && avui.getDay() <= 2) mode = 'resultats'; // dilluns i dimarts: resultats del cap de setmana passat
  if (mode === 'resultats') dissabte.setDate(dissabte.getDate() - 7);

  // Escala el cartell perquè hi càpiga a la pantalla
  function escala() {
    const k = Math.min(1, (window.innerWidth - 32) / 1080, (window.innerHeight - 90) / ALT() * 1.6);
    document.documentElement.style.setProperty('--k', Math.max(0.25, k).toFixed(4));
  }
  window.addEventListener('resize', escala);

  // Peu: Instagram, patrocinador i TikTok (surten sempre)
  function pintaPeu() {
    const x = (xarxa, dreta) => EXTRA[xarxa] ? `<div class="xarxa ${dreta ? 'dreta' : ''}">${ICONA[xarxa]}@${html(EXTRA[xarxa])}</div>` : '<div></div>';
    const p = EXTRA.patrocinador;
    const patro = p?.logo ? `<div class="patro"><img src="../${p.logo}" alt="${html(p.nombre || '')}"></div>`
      : p?.nombre ? `<div class="patro"><span class="nom">${html(p.nombre)}</span></div>`
      : '<div class="patro buit-p">Espai per al vostre patrocinador</div>';
    $('peu').innerHTML = x('instagram') + patro + x('tiktok', true);
    if (EXTRA.foto) { $('foto').hidden = false; $('foto').style.backgroundImage = `url(../${EXTRA.foto})`; }
  }

  function partitsDe(f) {
    const llista = [];
    for (const e of DADES.equipos) for (const p of e.partidos) {
      if (p.f !== f) continue;
      const casa = p.local === NUESTRO;
      llista.push({ ...p, equip: e, casa, rival: casa ? p.visit : p.local });
    }
    return llista.sort((a, b) => (ORDRE.indexOf(a.equip.etapa) - ORDRE.indexOf(b.equip.etapa)) || a.h.localeCompare(b.h));
  }

  function resultat(p) {
    if (!p.res) return null;
    const [l, v] = p.res, nos = p.casa ? l : v, ells = p.casa ? v : l;
    return { txt: `${l}-${v}`, lletra: nos > ells ? 'G' : nos < ells ? 'P' : 'E' };
  }

  function columna(dia, id) {
    const llista = partitsDe(iso(dia));
    $(id + '-tit').textContent = `${DIES[dia.getDay()]} ${dia.getDate()}`;
    $(id + '-sub').textContent = llista.length
      ? `${llista.length} partits · ${llista.filter(p => p.casa).length} a casa · ${llista.filter(p => !p.casa).length} fora`
      : 'Sense partits';
    let h = '', grup = null;
    for (const p of llista) {
      if (p.equip.etapa !== grup) { grup = p.equip.etapa; h += `<div class="grup">${MINI}${grup}</div>`; }
      const r = resultat(p);
      const dreta = mode === 'resultats' && r ? `<span class="res ${r.lletra}">${r.txt}</span>`
        : `<span class="lloc ${p.casa ? 'casa' : 'fora'}">${p.casa ? 'Casa' : 'Fora'}</span>`;
      h += `<div class="fila"><span class="h">${html(p.h)}</span>${MINI}<span class="eq">${html(p.equip.nombre)}</span><span class="rv"><i>vs</i> ${html(p.rival)}</span>${dreta}</div>`;
    }
    $(id).innerHTML = h || '<div class="buit">Cap partit aquest dia</div>';
    return llista;
  }

  // Redueix la lletra fins que tots els partits hi caben
  function ajusta() {
    for (const id of ['d1', 'd2']) {
      const el = $(id); let fs = 28;
      el.style.setProperty('--fs', fs + 'px');
      while (el.scrollHeight > el.clientHeight + 1 && fs > 12) { fs -= 0.5; el.style.setProperty('--fs', fs + 'px'); }
    }
  }

  function pinta() {
    const diumenge = new Date(dissabte); diumenge.setDate(dissabte.getDate() + 1);
    $('semana').textContent = `${dissabte.getDate()} i ${diumenge.getDate()} ${deMes(diumenge.getMonth())}`;
    $('m-partits').setAttribute('aria-pressed', mode === 'partits');
    $('m-resultats').setAttribute('aria-pressed', mode === 'resultats');
    $('eyebrow').textContent = mode === 'resultats' ? 'Resultats del cap de setmana' : 'Partits del cap de setmana';
    $('dates').textContent = `Dissabte ${dissabte.getDate()} i diumenge ${diumenge.getDate()} ${deMes(diumenge.getMonth())}`;
    if (!DADES) return;

    const tots = [...columna(dissabte, 'd1'), ...columna(diumenge, 'd2')];

    // Destacats: els primers equips (sènior masculí i femení)
    const prim = tots.filter(p => p.equip.slug.endsWith('/senior-a') || p.equip.slug.endsWith('/femeni-senior-a'));
    $('destacats').hidden = !prim.length;
    $('destacats').style.gridTemplateColumns = prim.length > 1 ? '1fr 1fr' : '1fr';
    $('destacats').innerHTML = prim.map(p => {
      const r = resultat(p), d = new Date(p.f + 'T12:00');
      return `<div class="dest"><div class="t">★ ${html(p.equip.nombre)}</div>
        <div class="vs"><span>${html(p.local)}</span><b>${mode === 'resultats' && r ? r.txt : 'VS'}</b><span>${html(p.visit)}</span></div>
        <div class="info">${DIES[d.getDay()]} ${d.getDate()} · ${html(p.h)} h · ${p.casa ? 'A casa' : 'Fora'}</div></div>`;
    }).join('');

    // Equips que descansen (sense partit ni dissabte ni diumenge)
    const juguen = new Set(tots.map(p => p.equip.slug));
    const descansen = DADES.equipos.filter(e => !juguen.has(e.slug) && e.partidos.length);
    $('descansen').hidden = !descansen.length;
    $('descansen').innerHTML = `<b>Descansen</b>${descansen.map(e => `<span>${html(e.nombre)}</span>`).join('')}`;

    const casa = tots.filter(p => p.casa).length;
    $('totals').innerHTML = [[tots.length, 'Partits', 'partits'], [casa, 'A casa', 'casa'], [tots.length - casa, 'Fora', 'fora'], [descansen.length, 'Descansen', 'descansen']]
      .map(([n, t, ic]) => `<div class="tot">${ICONA[ic]}<div><b>${n}</b><span>${t}</span></div></div>`).join('');

    ajusta();
    const revisat = DADES.equipos.map(e => e.revisado).filter(Boolean).sort().pop();
    $('nota').textContent = tots.length
      ? `Dades revisades el ${revisat ? new Date(revisat).toLocaleString('ca-ES', { dateStyle: 'short', timeStyle: 'short' }) : '—'}. Toca «Descarregar imatge» per penjar-lo a Instagram.`
      : 'No hi ha cap partit aquest cap de setmana.';
  }

  $('ant').addEventListener('click', () => { dissabte.setDate(dissabte.getDate() - 7); pinta(); });
  $('sig').addEventListener('click', () => { dissabte.setDate(dissabte.getDate() + 7); pinta(); });
  $('m-partits').addEventListener('click', () => { mode = 'partits'; pinta(); });
  $('m-resultats').addEventListener('click', () => { mode = 'resultats'; pinta(); });
  $('f-post').addEventListener('click', () => { format = 'post'; posaFormat(); });
  $('f-historia').addEventListener('click', () => { format = 'historia'; posaFormat(); });

  $('baixar').addEventListener('click', async () => {
    const b = $('baixar'); b.disabled = true; b.textContent = 'Preparant…';
    try {
      const canvas = await fesImatge();
      const a = document.createElement('a');
      a.download = `partits-${CLUB}-${iso(dissabte)}${mode === 'resultats' ? '-resultats' : ''}-${format}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    } catch (e) {
      alert('No s\'ha pogut crear la imatge. Torna-ho a provar.');
    } finally {
      b.disabled = false; b.textContent = '⬇ Descarregar imatge';
    }
  });

  // Imatge a mida real: es dibuixa una còpia del cartell fora de la pantalla, sense escalar,
  // perquè html2canvas no la retalli a la mida de la finestra
  async function fesImatge() {
    await document.fonts.ready;
    const copia = $('cartell').cloneNode(true);
    copia.removeAttribute('id');
    Object.assign(copia.style, { transform: 'none', position: 'fixed', left: '0', top: '0', zIndex: '-1' });
    document.body.appendChild(copia);
    try {
      return await html2canvas(copia, { width: 1080, height: ALT(), windowWidth: 1080, windowHeight: ALT(), scale: 1, scrollX: 0, scrollY: 0, backgroundColor: null, useCORS: true });
    } finally {
      copia.remove();
    }
  }

  pintaPeu();
  posaFormat();
  pinta();
  document.fonts.ready.then(() => DADES && ajusta());
  fetch(API + '/api/cartell?club=' + CLUB).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { DADES = d; pinta(); })
    .catch(() => { $('nota').textContent = 'No s\'han pogut carregar els partits. Torna-ho a provar en una estona.'; });
</script>
</body>
</html>
