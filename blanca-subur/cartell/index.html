<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cartell setmanal · Blanca Subur</title>
<link rel="icon" type="image/png" href="../iconos/app-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --color: #1747c9; --hondo: #0b2a7a; --claro: #3a74ff; --suave: #e8efff;
    --tinta: #131722; --gris: #5f6678; --fondo: #eef1f6;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --alt: 1350px; /* alçada del cartell: 1350 (post) o 1920 (història) */
    --texto: "Barlow", "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--fondo); font-family: var(--texto); color: var(--tinta); }
  button { font: inherit; cursor: pointer; }

  /* ---------- Barra de control (no sale en la imagen) ---------- */
  .control {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #dfe3ea;
  }
  .control .semana { font-weight: 700; min-width: 190px; text-align: center; }
  .btn { border: 1.5px solid #d6dbe5; background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; }
  .btn.prim { background: var(--color); border-color: var(--color); color: #fff; }
  .btn[aria-pressed="true"] { background: var(--suave); border-color: var(--color); color: var(--hondo); }
  .nota { text-align: center; color: var(--gris); font-size: 0.85rem; margin: 10px 16px 0; }

  /* ---------- Cartell: 1080 × 1350 (post d'Instagram) o 1080 × 1920 (història / TikTok) ---------- */
  .escena { display: flex; justify-content: center; padding: 16px 0 40px; }
  .marco { width: calc(1080px * var(--k)); height: calc(var(--alt) * var(--k)); overflow: hidden; }
  .cartell {
    width: 1080px; height: var(--alt); transform: scale(var(--k)); transform-origin: top left;
    position: relative; overflow: hidden; box-sizing: border-box;
    padding: 64px 48px 44px;
    /* degradado vertical: html2canvas dibuja mal los degradados en diagonal */
    background: linear-gradient(180deg, var(--claro) 0%, var(--color) 40%, var(--hondo) 100%);
    color: #fff; display: flex; flex-direction: column; gap: 26px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.5);
  }
  .cartell svg.campo { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cab { position: relative; text-align: center; }
  .cab .eyebrow { font-size: 26px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.85; }
  .cab h1 {
    margin: 6px 0 0; font-family: var(--display); font-style: italic; font-weight: 900;
    font-size: 132px; line-height: 0.86; text-transform: uppercase; letter-spacing: -0.01em;
    text-shadow: 0 6px 0 rgba(0,0,0,0.18);
  }
  .cab h1 small { display: block; font-size: 0.6em; }
  /* Escut del club al costat del títol */
  .cab-fila { display: flex; align-items: center; justify-content: center; gap: 30px; }
  .escut { width: 150px; height: 150px; flex: none; border-radius: 50%; background: #fff; padding: 16px; box-sizing: border-box;
    object-fit: contain; box-shadow: 0 10px 24px -10px rgba(0,0,0,0.45); }
  .cab-fila h1 { text-align: left; }
  /* Format post: més compacte */
  .cartell.post { padding: 46px 44px 34px; gap: 18px; }
  .post .cab h1 { font-size: 100px; }
  .post .escut { width: 124px; height: 124px; padding: 13px; }
  .post .cab .eyebrow { font-size: 22px; }
  .post .cab .dates { font-size: 32px; margin-top: 8px; }
  .post .totals { display: none; }
  .post .dest { padding: 12px 18px; }
  .post .dest .t { font-size: 28px; } .post .dest .vs { font-size: 27px; margin: 4px 0; } .post .dest .info { font-size: 21px; }
  .cab .dates { margin-top: 14px; font-family: var(--display); font-weight: 800; font-size: 38px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* Partits destacats (primers equips) */
  .destacats { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .dest { background: #fff; color: var(--tinta); border-radius: 26px; padding: 18px 22px; text-align: center; }
  .dest .t { font-family: var(--display); font-weight: 900; font-size: 34px; text-transform: uppercase; color: var(--color); }
  .dest .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 8px 0; font-family: var(--display); font-weight: 800; font-size: 31px; text-transform: uppercase; line-height: 1; }
  .dest .vs b { font-style: italic; font-size: 40px; color: var(--color); }
  .dest .info { font-weight: 700; font-size: 24px; color: var(--gris); }

  /* Dues columnes: dissabte i diumenge */
  .dies { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .dia { background: #fff; color: var(--tinta); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .dia-cab { background: var(--hondo); color: #fff; padding: 14px 18px 12px; text-align: center; }
  .dia-cab b { display: block; font-family: var(--display); font-weight: 900; font-size: 40px; text-transform: uppercase; line-height: 1; }
  .dia-cab span { font-size: 21px; font-weight: 600; opacity: 0.9; }
  .dia-cos { flex: 1; min-height: 0; overflow: hidden; padding: 6px 14px 10px; font-size: var(--fs, 24px); }
  .grup {
    margin: 0.55em 0 0.2em; padding: 0.15em 0.55em; border-radius: 0.4em;
    background: var(--suave); color: var(--hondo);
    font-family: var(--display); font-weight: 900; font-size: 1.02em; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .fila { display: grid; grid-template-columns: 2.7em auto 1fr auto; align-items: center; gap: 0.35em; padding: 0.2em 0.1em; border-bottom: 1px solid #edf0f5; line-height: 1.15; white-space: nowrap; }
  .fila .h { font-weight: 700; color: var(--gris); }
  .fila .eq { font-weight: 700; }
  .fila .rv { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--gris); font-size: 0.88em; }
  .fila .rv i { font-style: normal; font-weight: 700; opacity: 0.7; }
  .lloc { font-family: var(--display); font-weight: 800; font-size: 0.85em; padding: 0.1em 0.45em; border-radius: 0.35em; text-transform: uppercase; }
  .lloc.casa { background: var(--color); color: #fff; }
  .lloc.fora { background: #e3e7ef; color: var(--tinta); }
  .res { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 1.1em; padding: 0.05em 0.4em; border-radius: 0.35em; color: #fff; white-space: nowrap; }
  .res.G { background: #1f8a4c; } .res.E { background: #b7791f; } .res.P { background: #9aa1b2; }
  .buit { color: var(--gris); text-align: center; padding: 1.5em 0.5em; }

  /* Peu */
  .descansen { position: relative; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.35); border-radius: 22px; padding: 12px 20px; text-align: center; font-size: 24px; }
  .descansen b { font-family: var(--display); font-weight: 900; font-size: 28px; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 8px; }
  .totals { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tot { background: rgba(0,0,0,0.2); border-radius: 20px; padding: 12px 10px; text-align: center; }
  .tot b { display: block; font-family: var(--display); font-weight: 900; font-size: 56px; line-height: 1; }
  .tot span { font-size: 21px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.9; }
  .peu { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 22px; }
  .patro { border: 2px dashed rgba(255,255,255,0.6); border-radius: 16px; padding: 12px 20px; font-weight: 700; letter-spacing: 0.04em; }
  .marca { opacity: 0.85; font-weight: 600; }
</style>
</head>
<body>
<div class="control">
  <button class="btn" id="ant" type="button" aria-label="Cap de setmana anterior">‹</button>
  <div class="semana" id="semana">…</div>
  <button class="btn" id="sig" type="button" aria-label="Cap de setmana següent">›</button>
  <button class="btn" id="m-partits" type="button" aria-pressed="true">Partits</button>
  <button class="btn" id="m-resultats" type="button" aria-pressed="false">Resultats</button>
  <button class="btn" id="f-post" type="button" aria-pressed="true">Post</button>
  <button class="btn" id="f-historia" type="button" aria-pressed="false">Història</button>
  <button class="btn prim" id="baixar" type="button">⬇ Descarregar imatge</button>
</div>
<p class="nota" id="nota">Carregant els partits…</p>

<div class="escena"><div class="marco"><div class="cartell post" id="cartell">
  <svg class="campo" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="4">
      <rect x="40" y="40" width="1000" height="1840" rx="8"/><line x1="40" y1="960" x2="1040" y2="960"/><circle cx="540" cy="960" r="150"/>
      <rect x="290" y="40" width="500" height="230"/><rect x="290" y="1650" width="500" height="230"/>
    </g>
  </svg>
  <header class="cab">
    <div class="eyebrow" id="eyebrow">Partits del cap de setmana</div>
    <div class="cab-fila"><img class="escut" src="../escut.png" alt="" onerror="this.remove()"><h1><small>Partits</small>Blanca Subur</h1></div>
    <div class="dates" id="dates"></div>
  </header>
  <section class="destacats" id="destacats" hidden></section>
  <section class="dies">
    <div class="dia"><div class="dia-cab"><b id="d1-tit"></b><span id="d1-sub"></span></div><div class="dia-cos" id="d1"></div></div>
    <div class="dia"><div class="dia-cab"><b id="d2-tit"></b><span id="d2-sub"></span></div><div class="dia-cos" id="d2"></div></div>
  </section>
  <section class="descansen" id="descansen" hidden></section>
  <section class="totals" id="totals"></section>
  <footer class="peu">
    <div class="patro">Espai per al vostre patrocinador</div>
    <div class="marca">amb ConvoCAT</div>
  </footer>
</div></div></div>

<script>
  const API = 'https://calendari-futbol-base-demo.netlify.app'; // servidor de ConvoCAT (Netlify)
  const CLUB = 'blanca-subur', NUESTRO = 'Blanca Subur';
  const ORDRE = ['Prebenjamí', 'Benjamí', 'Aleví', 'Infantil', 'Cadet', 'Juvenil', 'Femení', 'Sènior'];
  const DIES = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  const MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
  const $ = id => document.getElementById(id);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const deMes = m => (/^[aeiou]/i.test(MESOS[m]) ? "d'" : 'de ') + MESOS[m];
  const nomDia = d => `${DIES[d.getDay()]} ${d.getDate()} ${deMes(d.getMonth())}`;
  const html = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  let DADES = null, mode = 'partits';
  let format = 'post'; try { format = localStorage.getItem('cartell-format') || 'post'; } catch (e) {}
  const ALT = () => format === 'post' ? 1350 : 1920;
  function posaFormat() {
    document.documentElement.style.setProperty('--alt', ALT() + 'px');
    $('cartell').classList.toggle('post', format === 'post');
    $('f-post').setAttribute('aria-pressed', format === 'post');
    $('f-historia').setAttribute('aria-pressed', format !== 'post');
    try { localStorage.setItem('cartell-format', format); } catch (e) {}
    escala(); if (DADES) ajusta();
  }
  // Cap de setmana: de dilluns a divendres, el que ve; dissabte i diumenge, l'actual
  const avui = new Date(); avui.setHours(12, 0, 0, 0);
  let dissabte = new Date(avui); dissabte.setDate(avui.getDate() + ((6 - avui.getDay() + 7) % 7) - (avui.getDay() === 0 ? 7 : 0));
  if (avui.getDay() >= 1 && avui.getDay() <= 2) mode = 'resultats'; // dilluns i dimarts: resultats del cap de setmana passat
  if (mode === 'resultats') dissabte.setDate(dissabte.getDate() - 7);

  // Escala el cartell perquè hi càpiga a la pantalla
  function escala() {
    const k = Math.min(1, (window.innerWidth - 32) / 1080, (window.innerHeight - 90) / ALT() * 1.6);
    document.documentElement.style.setProperty('--k', Math.max(0.25, k).toFixed(4));
  }
  window.addEventListener('resize', escala); escala();

  function partitsDe(f) {
    const llista = [];
    for (const e of DADES.equipos) for (const p of e.partidos) {
      if (p.f !== f) continue;
      const casa = p.local === NUESTRO;
      llista.push({ ...p, equip: e, casa, rival: casa ? p.visit : p.local });
    }
    return llista.sort((a, b) => (ORDRE.indexOf(a.equip.etapa) - ORDRE.indexOf(b.equip.etapa)) || a.h.localeCompare(b.h));
  }

  function resultat(p) {
    if (!p.res) return null;
    const [l, v] = p.res, nos = p.casa ? l : v, ells = p.casa ? v : l;
    return { txt: `${l}-${v}`, lletra: nos > ells ? 'G' : nos < ells ? 'P' : 'E' };
  }

  function columna(dia, id) {
    const llista = partitsDe(iso(dia));
    $(id + '-tit').textContent = `${DIES[dia.getDay()]} ${dia.getDate()}`;
    $(id + '-sub').textContent = llista.length
      ? `${llista.length} partits · ${llista.filter(p => p.casa).length} a casa · ${llista.filter(p => !p.casa).length} fora`
      : 'Sense partits';
    let h = '', grup = null;
    for (const p of llista) {
      if (p.equip.etapa !== grup) { grup = p.equip.etapa; h += `<div class="grup">${grup}</div>`; }
      const r = resultat(p);
      const dreta = mode === 'resultats' && r ? `<span class="res ${r.lletra}">${r.txt}</span>`
        : `<span class="lloc ${p.casa ? 'casa' : 'fora'}">${p.casa ? 'Casa' : 'Fora'}</span>`;
      h += `<div class="fila"><span class="h">${html(p.h)}</span><span class="eq">${html(p.equip.nombre)}</span><span class="rv"><i>vs</i> ${html(p.rival)}</span>${dreta}</div>`;
    }
    $(id).innerHTML = h || '<div class="buit">Cap partit aquest dia</div>';
    return llista;
  }

  // Redueix la lletra fins que tots els partits hi caben
  function ajusta() {
    for (const id of ['d1', 'd2']) {
      const el = $(id); let fs = 30;
      el.style.setProperty('--fs', fs + 'px');
      while (el.scrollHeight > el.clientHeight + 1 && fs > 14) { fs -= 0.5; el.style.setProperty('--fs', fs + 'px'); }
    }
  }

  function pinta() {
    const diumenge = new Date(dissabte); diumenge.setDate(dissabte.getDate() + 1);
    $('semana').textContent = `${dissabte.getDate()} i ${diumenge.getDate()} ${deMes(diumenge.getMonth())}`;
    $('m-partits').setAttribute('aria-pressed', mode === 'partits');
    $('m-resultats').setAttribute('aria-pressed', mode === 'resultats');
    $('eyebrow').textContent = mode === 'resultats' ? 'Resultats del cap de setmana' : 'Partits del cap de setmana';
    $('dates').textContent = `Dissabte ${dissabte.getDate()} i diumenge ${diumenge.getDate()} ${deMes(diumenge.getMonth())}`;
    if (!DADES) return;

    const tots = [...columna(dissabte, 'd1'), ...columna(diumenge, 'd2')];

    // Destacats: els primers equips (sènior masculí i femení)
    const prim = tots.filter(p => p.equip.slug.endsWith('/senior-a') || p.equip.slug.endsWith('/femeni-senior-a'));
    $('destacats').hidden = !prim.length;
    $('destacats').style.gridTemplateColumns = prim.length > 1 ? '1fr 1fr' : '1fr';
    $('destacats').innerHTML = prim.map(p => {
      const r = resultat(p), d = new Date(p.f + 'T12:00');
      return `<div class="dest"><div class="t">${html(p.equip.nombre)}</div>
        <div class="vs"><span>${html(p.local)}</span><b>${mode === 'resultats' && r ? r.txt : 'VS'}</b><span>${html(p.visit)}</span></div>
        <div class="info">${DIES[d.getDay()]} ${d.getDate()} · ${html(p.h)} h · ${p.casa ? 'A casa' : 'Fora'}</div></div>`;
    }).join('');

    // Equips que descansen (sense partit ni dissabte ni diumenge)
    const juguen = new Set(tots.map(p => p.equip.slug));
    const descansen = DADES.equipos.filter(e => !juguen.has(e.slug) && e.partidos.length);
    $('descansen').hidden = !descansen.length;
    $('descansen').innerHTML = `<b>Descansen</b>${descansen.map(e => html(e.nombre)).join(' · ')}`;

    const casa = tots.filter(p => p.casa).length;
    $('totals').innerHTML = [[tots.length, 'Partits'], [casa, 'A casa'], [tots.length - casa, 'Fora'], [descansen.length, 'Descansen']]
      .map(([n, t]) => `<div class="tot"><b>${n}</b><span>${t}</span></div>`).join('');

    ajusta();
    const revisat = DADES.equipos.map(e => e.revisado).filter(Boolean).sort().pop();
    $('nota').textContent = tots.length
      ? `Dades de la Federació revisades el ${revisat ? new Date(revisat).toLocaleString('ca-ES', { dateStyle: 'short', timeStyle: 'short' }) : '—'}. Toca «Descarregar imatge» per penjar-lo a Instagram.`
      : 'No hi ha cap partit aquest cap de setmana.';
  }

  $('ant').addEventListener('click', () => { dissabte.setDate(dissabte.getDate() - 7); pinta(); });
  $('sig').addEventListener('click', () => { dissabte.setDate(dissabte.getDate() + 7); pinta(); });
  $('m-partits').addEventListener('click', () => { mode = 'partits'; pinta(); });
  $('m-resultats').addEventListener('click', () => { mode = 'resultats'; pinta(); });
  $('f-post').addEventListener('click', () => { format = 'post'; posaFormat(); });
  $('f-historia').addEventListener('click', () => { format = 'historia'; posaFormat(); });

  $('baixar').addEventListener('click', async () => {
    const b = $('baixar'); b.disabled = true; b.textContent = 'Preparant…';
    try {
      const canvas = await fesImatge();
      const a = document.createElement('a');
      a.download = `partits-${CLUB}-${iso(dissabte)}${mode === 'resultats' ? '-resultats' : ''}-${format}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    } catch (e) {
      alert('No s\'ha pogut crear la imatge. Torna-ho a provar.');
    } finally {
      b.disabled = false; b.textContent = '⬇ Descarregar imatge';
    }
  });

  // Imatge a mida real (1080 × 1350 o 1080 × 1920): es dibuixa una còpia del cartell fora de la pantalla, sense escalar,
  // perquè html2canvas no la retalli a la mida de la finestra
  async function fesImatge() {
    await document.fonts.ready;
    const copia = $('cartell').cloneNode(true);
    copia.removeAttribute('id');
    Object.assign(copia.style, { transform: 'none', position: 'fixed', left: '0', top: '0', zIndex: '-1' });
    document.body.appendChild(copia);
    try {
      return await html2canvas(copia, { width: 1080, height: ALT(), windowWidth: 1080, windowHeight: ALT(), scale: 1, scrollX: 0, scrollY: 0, backgroundColor: null, useCORS: true });
    } finally {
      copia.remove();
    }
  }

  posaFormat();
  pinta();
  document.fonts.ready.then(() => DADES && ajusta());
  // Patrocinador del club (panel)
  fetch(API + '/api/config?club=' + CLUB).then(r => r.ok ? r.json() : null).then(c => {
    const p = c?.club?.patrocinador;
    if (p?.nombre) document.querySelector('.patro').textContent = 'Amb el suport de ' + p.nombre;
  }).catch(() => {});
  fetch(API + '/api/cartell?club=' + CLUB).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { DADES = d; pinta(); })
    .catch(() => { $('nota').textContent = 'No s\'han pogut carregar els partits. Torna-ho a provar en una estona.'; });
</script>
</body>
</html>
